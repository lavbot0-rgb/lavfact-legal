<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lavfact TikTok Login</title>
    <style>
      body {
        color: #17202a;
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 40px auto;
        max-width: 760px;
        padding: 0 20px;
      }
      code {
        background: #f3f4f6;
        border-radius: 4px;
        display: block;
        overflow-wrap: anywhere;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <h1>TikTok Login Complete</h1>
    <p>Copy the full URL from your browser address bar and paste it into Lavfact to finish connecting TikTok.</p>
    <p>Current callback URL:</p>
    <code id="callback-url"></code>
    <script>
      document.getElementById("callback-url").textContent = window.location.href;
    </script>
  </body>
</html>
